<!DOCTYPE html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartIGCSE — pack player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette: squared exercise paper, graphite pencil, ballpoint blue, teacher's red pen */
  --paper:#F2F5F8;
  --paper-card:#FFFFFF;
  --grid-line:#DCE7F0;
  --grid-line-strong:#C7D8E6;
  --ink:#14243A;
  --ink-soft:#4A5B70;
  --ink-faint:#7B8A9C;
  --pen:#1D5FA8;
  --pen-dark:#164B85;
  --pen-wash:#E7EFF9;
  --red:#C42F2F;
  --red-wash:#FCEDED;
  --green:#14713F;
  --green-wash:#E8F5EE;
  --amber:#8A5A00;
  --amber-wash:#FBF2DF;
  --rule:#D3DEE8;

  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --tap:44px;
  --shadow:0 1px 2px rgba(20,36,58,.06), 0 8px 24px -12px rgba(20,36,58,.18);

  --font-display:'Bitter', Georgia, 'Times New Roman', serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:24px 24px;
  line-height:1.55;
  font-size:16px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important}
}

/* ---------- Masthead ---------- */
.masthead{
  background:var(--ink);
  color:#fff;
  border-bottom:3px solid var(--pen);
}
.masthead-in{
  max-width:900px;margin:0 auto;padding:18px 20px 16px;
  display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;
}
.crest{
  width:38px;height:38px;flex:0 0 38px;border-radius:50%;
  background:var(--pen);display:grid;place-items:center;margin-top:2px;
}
.crest svg{width:22px;height:22px}
.masthead h1{
  font-family:var(--font-display);font-weight:700;font-size:1.25rem;
  margin:0;letter-spacing:-.01em;line-height:1.25;
}
.masthead p{margin:3px 0 0;color:#B9C8DA;font-size:.82rem}
.masthead .spacer{flex:1 1 auto}

/* progress meter */
.meter{min-width:190px;padding-top:2px}
.meter-top{display:flex;justify-content:space-between;font-size:.72rem;color:#B9C8DA;
  text-transform:uppercase;letter-spacing:.09em;font-weight:600;margin-bottom:6px}
.meter-track{height:8px;border-radius:99px;background:#2B3F5C;overflow:hidden}
.meter-fill{height:100%;width:0;background:linear-gradient(90deg,var(--pen),#4E9BE8);
  border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* ---------- Worksheet tabs ---------- */
.tabs-wrap{position:sticky;top:0;z-index:30;background:rgba(242,245,248,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.tabs{max-width:900px;margin:0 auto;display:flex;gap:6px;padding:8px 12px;
  overflow-x:auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tab{
  flex:0 0 auto;min-height:var(--tap);padding:8px 14px;border-radius:var(--r-md);
  border:1px solid var(--rule);background:var(--paper-card);color:var(--ink-soft);
  font-family:var(--font-body);font-size:.84rem;font-weight:600;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;line-height:1.2;
  transition:background .15s, color .15s, border-color .15s;
}
.tab small{font-size:.68rem;font-weight:500;color:var(--ink-faint);letter-spacing:.02em}
.tab:hover{border-color:var(--pen);color:var(--pen)}
.tab:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab[aria-selected="true"] small{color:#A9BCD2}
.tab .dot{position:absolute}

/* ---------- Layout ---------- */
main{max-width:900px;margin:0 auto;padding:22px 16px 90px}

.sheet-head{
  background:var(--paper-card);border:1px solid var(--rule);border-radius:var(--r-lg);
  padding:20px 22px;box-shadow:var(--shadow);margin-bottom:20px;
  border-left:5px solid var(--pen);
}
.eyebrow{font-family:var(--font-mono);font-size:.74rem;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--pen);margin:0 0 6px}
.sheet-head h2{font-family:var(--font-display);font-size:1.42rem;margin:0 0 8px;line-height:1.25}
.sheet-head .obj{margin:0;color:var(--ink-soft);font-size:.94rem}
.sheet-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding-top:12px;
  border-top:1px dashed var(--rule);font-size:.8rem;color:var(--ink-faint);font-family:var(--font-mono)}

/* trick banner */
.trick{
  background:var(--amber-wash);border:1px solid #EBD9AE;border-radius:var(--r-md);
  padding:14px 16px;margin-bottom:20px;display:flex;gap:12px;align-items:flex-start;
}
.trick svg{flex:0 0 20px;width:20px;height:20px;color:var(--amber);margin-top:2px}
.trick h3{margin:0 0 3px;font-family:var(--font-display);font-size:.95rem;color:var(--amber)}
.trick p{margin:0;font-size:.9rem;color:#5E4405}

/* ---------- Question card ---------- */
.q{
  background:var(--paper-card);border:1px solid var(--rule);border-radius:var(--r-lg);
  padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);position:relative;
  transition:border-color .2s;
}
.q.is-right{border-color:#A9D8BF}
.q.is-wrong{border-color:#EFB6B6}
.q-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.q-no{
  flex:0 0 auto;min-width:30px;height:30px;padding:0 7px;border-radius:8px;
  background:var(--pen-wash);color:var(--pen-dark);font-family:var(--font-mono);
  font-weight:600;font-size:.85rem;display:grid;place-items:center;margin-top:1px;
}
.q-prompt{margin:0;font-size:1rem;line-height:1.5}
.q-prompt .sub{display:block;color:var(--ink-soft);font-size:.9rem;margin-top:4px}

/* fields */
.fields{display:flex;flex-direction:column;gap:12px;margin:14px 0 0}
.fields.row{flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:10px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label{font-size:.8rem;font-weight:600;color:var(--ink-soft);letter-spacing:.01em}
.field .lead{font-family:var(--font-mono);color:var(--ink);font-size:.95rem}
input[type="text"]{
  font-family:var(--font-mono);font-size:1rem;color:var(--pen-dark);
  min-height:var(--tap);padding:8px 12px;border:1.5px solid var(--grid-line-strong);
  border-radius:var(--r-sm);background:#FCFDFE;width:100%;
  transition:border-color .15s, box-shadow .15s;
}
input[type="text"]::placeholder{color:#AEBCCB;font-style:italic}
input[type="text"]:hover{border-color:#A9BFD4}
input[type="text"]:focus{outline:none;border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-wash)}
input[type="text"]:focus-visible{outline:none}
.field.w-sm input{max-width:110px}
.field.w-md input{max-width:190px}
.field.w-lg input{max-width:340px}
.field.correct input{border-color:var(--green);background:var(--green-wash)}
.field.incorrect input{border-color:var(--red);background:var(--red-wash)}
.mark{font-family:var(--font-mono);font-size:.78rem;font-weight:600;margin-top:2px}
.mark.ok{color:var(--green)}
.mark.no{color:var(--red)}

/* choice buttons */
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{
  min-height:var(--tap);padding:9px 16px;border-radius:var(--r-md);cursor:pointer;
  border:1.5px solid var(--grid-line-strong);background:#FCFDFE;color:var(--ink);
  font-family:var(--font-mono);font-size:.95rem;font-weight:500;transition:all .15s;
}
.choice:hover{border-color:var(--pen);color:var(--pen-dark)}
.choice:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.choice[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:#fff}
.choice.correct{background:var(--green-wash);border-color:var(--green);color:var(--green)}
.choice.incorrect{background:var(--red-wash);border-color:var(--red);color:var(--red)}

/* table style inputs */
.tbl{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:.9rem;margin-top:12px}
.tbl th,.tbl td{border:1px solid var(--grid-line-strong);padding:6px 8px;text-align:left;vertical-align:middle}
.tbl th{background:var(--pen-wash);color:var(--pen-dark);font-weight:600;font-size:.78rem;
  text-transform:uppercase;letter-spacing:.06em}
.tbl td input{min-height:38px;padding:5px 8px;font-size:.9rem}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}

/* hundred grid */
.grid100{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;max-width:460px;margin-top:12px}
.cellbtn{
  aspect-ratio:1;min-height:0;border:1px solid var(--grid-line-strong);border-radius:5px;
  background:#FCFDFE;font-family:var(--font-mono);font-size:.72rem;color:var(--ink-soft);
  cursor:pointer;padding:0;display:grid;place-items:center;transition:all .12s;
}
.cellbtn:hover{border-color:var(--pen);color:var(--pen)}
.cellbtn:focus-visible{outline:2px solid var(--pen);outline-offset:1px}
.cellbtn[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:#fff;font-weight:600}
.cellbtn.hit{background:var(--green-wash);border-color:var(--green);color:var(--green);font-weight:600}
.cellbtn.miss{background:var(--red-wash);border-color:var(--red);color:var(--red)}
.cellbtn.missed-prime{border-color:var(--amber);border-style:dashed;color:var(--amber)}
.grid-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-faint);margin-top:10px}
.grid-legend span{display:flex;align-items:center;gap:5px}
.swatch{width:11px;height:11px;border-radius:3px;border:1px solid}

/* diagrams */
.diagram{background:#FBFCFD;border:1px solid var(--rule);border-radius:var(--r-md);
  padding:14px;margin:12px 0;overflow-x:auto}
.diagram svg{display:block;max-width:100%;height:auto}
.redrawn{font-size:.74rem;color:var(--ink-faint);font-style:italic;margin:8px 0 0}

/* ---------- Actions & feedback ---------- */
.q-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{
  min-height:var(--tap);padding:10px 18px;border-radius:var(--r-md);cursor:pointer;
  font-family:var(--font-body);font-size:.9rem;font-weight:600;border:1.5px solid transparent;
  display:inline-flex;align-items:center;gap:7px;transition:all .15s;
}
.btn svg{width:16px;height:16px}
.btn:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.btn-primary{background:var(--pen);color:#fff;border-color:var(--pen)}
.btn-primary:hover{background:var(--pen-dark);border-color:var(--pen-dark)}
.btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--rule)}
.btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink)}
.btn-hint{background:transparent;color:var(--amber);border-color:#E4CE9B}
.btn-hint:hover{background:var(--amber-wash)}

.tickbox{width:34px;height:34px;flex:0 0 34px;margin-left:auto}
.tickbox svg{width:34px;height:34px}
.tickbox path{
  stroke:var(--red);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:var(--len,60);stroke-dashoffset:var(--len,60);
  animation:draw .45s cubic-bezier(.5,0,.3,1) forwards;
}
.tickbox.ok path{stroke:var(--green)}
@keyframes draw{to{stroke-dashoffset:0}}

.panel{margin-top:14px;border-radius:var(--r-md);padding:14px 16px;font-size:.92rem;
  border:1px solid;animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.panel h4{margin:0 0 6px;font-family:var(--font-display);font-size:.9rem;
  text-transform:uppercase;letter-spacing:.08em}
.panel p{margin:0 0 8px}
.panel p:last-child{margin-bottom:0}
.panel code{font-family:var(--font-mono);background:rgba(20,36,58,.06);
  padding:1px 5px;border-radius:4px;font-size:.88em}
.panel.explain{background:var(--pen-wash);border-color:#BFD6EF;color:#12365E}
.panel.explain h4{color:var(--pen-dark)}
.panel.hint{background:var(--amber-wash);border-color:#EBD9AE;color:#5E4405}
.panel.hint h4{color:var(--amber)}
.panel.solved{background:var(--green-wash);border-color:#A9D8BF;color:#0D5730}
.panel.solved h4{color:var(--green)}

/* ---------- Sheet footer ---------- */
.sheet-foot{
  background:var(--paper-card);border:1px solid var(--rule);border-radius:var(--r-lg);
  padding:18px 20px;margin-top:22px;box-shadow:var(--shadow);
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;
}
.score{font-family:var(--font-mono);font-size:.9rem;color:var(--ink-soft)}
.score strong{color:var(--ink);font-size:1.15rem}

/* index page */
.index-note{margin:0 0 18px;color:var(--ink-soft);font-size:.94rem}
.idx{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--paper-card)}
.idx th,.idx td{border:1px solid var(--grid-line-strong);padding:9px 10px;text-align:left;vertical-align:top}
.idx th{background:var(--ink);color:#fff;font-size:.74rem;text-transform:uppercase;
  letter-spacing:.08em;font-weight:600}
.idx td:first-child{font-family:var(--font-mono);font-weight:600;color:var(--pen-dark);width:44px}
.idx td:nth-child(2){width:26%;font-weight:500}
.idx tr.ready td:first-child{background:var(--green-wash);color:var(--green)}
.idx .status{font-family:var(--font-mono);font-size:.74rem;white-space:nowrap}
.idx .status.on{color:var(--green)}
.idx .status.off{color:var(--ink-faint)}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-size:.88rem;
  font-weight:500;box-shadow:0 10px 30px -8px rgba(20,36,58,.5);z-index:60;
  transition:transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0)}

.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:768px){
  .masthead-in{padding:14px 16px}
  .masthead h1{font-size:1.08rem}
  .meter{min-width:100%;order:3}
  main{padding:16px 12px 80px}
  .q{padding:16px 14px}
  .sheet-head{padding:16px 16px}
  .sheet-head h2{font-size:1.2rem}
  .grid100{gap:2px}
  .cellbtn{font-size:.62rem}
  .idx td:nth-child(2){width:auto}
}
@media (max-width:420px){
  .fields.row{flex-direction:column;align-items:stretch}
  .field.w-sm input,.field.w-md input,.field.w-lg input{max-width:none}
}

.langbar{display:flex;align-items:center;gap:8px}
.langbar label{font-size:.72rem;color:#B9C8DA;text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.langbar select{min-height:38px;padding:6px 10px;border-radius:8px;border:1px solid #3A5170;
  background:#1C2E47;color:#fff;font-family:var(--font-body);font-size:.85rem;cursor:pointer}
.langbar select:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
</style>
</head>

<script>/* ============================================================
   SmartIGCSE — checks.js
   The complete vocabulary of answer checks.

   Content packs contain DATA ONLY. They never contain code.
   A pack may only reference a "kind" that exists in this file,
   which is what makes machine-generated content safe to run and
   possible to validate before a child ever sees it.

   Works unchanged in Node and in the browser.
   ============================================================ */

/* ---------- primitives ---------- */
const dash = s => String(s == null ? '' : s).replace(/[\u2212\u2013\u2014]/g, '-').trim();

function toNum(s) {
  if (typeof s === 'number') return s;
  const t = dash(s).replace(/[^0-9.\-]/g, '');
  if (t === '' || t === '-') return NaN;
  return Number(t);
}
function toList(s) {
  if (Array.isArray(s)) return s.map(toNum).filter(n => !Number.isNaN(n));
  return dash(s).split(/[,;]+|\s+/).filter(Boolean).map(toNum).filter(n => !Number.isNaN(n));
}
const isPrime = n => {
  n = Math.abs(n);
  if (!Number.isInteger(n) || n < 2) return false;
  for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;
  return true;
};
const isSquare = n => n >= 0 && Number.isInteger(Math.sqrt(n));

const sameOrdered = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
const sameSet = (a, b) => sameOrdered([...a].sort((x, y) => x - y), [...b].sort((x, y) => x - y));
// Strips hyphens and ALL whitespace (not just collapsing runs of it) before
// comparing - real bug found live 2026-08-26: an extracted answer like
// "Two-thirds" only matched a kid typing the hyphen exactly; typing the far
// more natural "two thirds" (no hyphen, how anyone actually says it) was
// marked wrong even though it was the same answer. Punctuation/hyphen/
// spacing differences shouldn't fail a text-match answer check.
const normText = s => dash(s).toLowerCase().replace(/[.,;:!?'"()-]/g, '').replace(/\s+/g, '').trim();
const normExpr = s => dash(s).toLowerCase()
  .replace(/\s|[×*·]/g, '')
  .replace(/position|term|pattern/g, 'n')
  .replace(/([0-9n])x([0-9n])/g, '$1$2');   // "2 x position" -> "2n"

/* ============================================================
   THE CHECK VOCABULARY
   Each entry: run(check, raw) -> boolean
               show(check)     -> string shown when the child is wrong
   ============================================================ */
const CHECKS = {

  /* --- numeric --- */
  exact_number: {
    run: (c, v) => toNum(v) === c.value,
    show: c => String(c.value)
  },
  any_of_numbers: {                       // several answers are equally right
    run: (c, v) => c.values.includes(toNum(v)),
    show: c => c.values.join(' or ')
  },
  number_in_range: {
    run: (c, v) => { const n = toNum(v); return !Number.isNaN(n) && n >= c.min && n <= c.max; },
    show: c => `any value from ${c.min} to ${c.max}`
  },

  /* --- collections --- */
  sequence: {                              // order matters
    run: (c, v) => sameOrdered(toList(v), c.values),
    show: c => c.values.join(', ')
  },
  sequence_any_of: {                       // several valid endings, e.g. stop at 6 or go on to 11
    run: (c, v) => { const l = toList(v).join(','); return c.options.some(o => o.join(',') === l); },
    show: c => c.options[0].join(', ')
  },
  number_set: {                            // order does not matter (factor lists)
    run: (c, v) => sameSet(toList(v), c.values),
    show: c => c.values.join(', ')
  },
  number_grid: {                           // tap-a-grid, e.g. circle the primes
    run: (c, v) => Array.isArray(v) && sameSet(v, c.values),
    show: c => c.values.join(', ')
  },

  /* --- choice --- */
  choice: {
    run: (c, v) => v === c.value,
    show: c => c.value
  },
  multi_choice: {
    run: (c, v) => Array.isArray(v) && v.length === c.values.length && c.values.every(x => v.includes(x)),
    show: c => c.values.join(', ')
  },

  /* --- language --- */
  text_exact: {
    run: (c, v) => { const n = normText(v); return n !== '' && c.accept.some(a => normText(a) === n); },
    show: c => c.accept[0]
  },
  keywords: {                              // "explain why" answers: each group needs one synonym present
    run: (c, v) => { const n = normText(v); return n !== '' && c.allOf.every(g => g.some(w => n.includes(normText(w)))); },
    show: c => c.modelAnswer
  },
  expression: {                            // algebraic rules: "2n+5", "2 x position + 5"
    run: (c, v) => c.accept.some(a => normExpr(a) === normExpr(v)),
    show: c => c.accept[0]
  },

  /* --- open-ended maths: many right answers, one rule --- */
  sum_of_primes: {                         // Goldbach style: 12 = 5 + 7
    run: (c, v) => { const p = toList(v); return p.length === 2 && p.every(isPrime) && p[0] + p[1] === c.target; },
    show: c => {
      for (let a = 2; a <= c.target / 2; a++) if (isPrime(a) && isPrime(c.target - a)) return `${a} + ${c.target - a}`;
      return 'no pair exists';
    }
  },
  squares_sum_to_square: {                 // "three square numbers that make a square number"
    run: (c, v) => {
      const l = toList(v);
      return l.length === c.count && l.every(isSquare) && isSquare(l.reduce((a, b) => a + b, 0));
    },
    show: c => c.example || 'for example 4, 9, 36'
  },
  digit_completes_divisibility: {          // 83_ must divide by 4
    run: (c, v) => {
      const d = toNum(v);
      return Number.isInteger(d) && d >= 0 && d <= 9 && Number(String(c.prefix) + d) % c.by === 0;
    },
    show: c => {
      const out = [];
      for (let d = 0; d <= 9; d++) if (Number(String(c.prefix) + d) % c.by === 0) out.push(d);
      return out.length ? out.join(' or ') : 'no digit works';
    }
  },
  digit_cards_product: {                   // use each card once; product must end in 0
    run: (c, v) => {
      const parts = dash(v).toLowerCase().replace(/[×*]/g, 'x').split('x')
        .map(p => p.replace(/[^0-9]/g, '')).filter(Boolean);
      if (parts.length !== 2) return false;
      const used = (parts[0] + parts[1]).split('').sort().join('');
      if (used !== [...String(c.digits)].sort().join('')) return false;
      const product = Number(parts[0]) * Number(parts[1]);
      if (c.endsWith !== undefined && product % 10 !== c.endsWith) return false;
      if (c.equals !== undefined && product !== c.equals) return false;
      return true;
    },
    show: c => c.example || 'use each card once'
  }
};

/* ---------- public API ---------- */
function checkAnswer(check, raw) {
  const impl = CHECKS[check && check.kind];
  if (!impl) return false;
  try { return impl.run(check, raw === undefined || raw === null ? '' : raw); }
  catch { return false; }
}
function answerText(field) {
  if (field.answerText) return field.answerText;
  const impl = CHECKS[field.check && field.check.kind];
  return impl ? impl.show(field.check) : '';
}
const KNOWN_CHECK_KINDS = Object.keys(CHECKS);
</script>
<script>/* ============================================================

const MEDIA_RENDERERS = {
  thermometer(m){

  number_line(m){

    </svg>`;
  },
  spider(m){
    const pos=[[90,30],[330,30],[20,110],[400,110],[90,190],[330,190]];
    return `<svg viewBox="0 0 500 230" role="img" aria-label="${m.centre} in the centre with ${m.around.length} numbers around it">
      ${m.around.map((v,i)=>`<line x1="${pos[i][0]+50}" y1="${pos[i][1]+16}" x2="215" y2="115" stroke="#C7D8E6" stroke-width="2"/>`).join('')}
      <circle cx="215" cy="115" r="46" fill="#14243A"/>
      <text x="215" y="121" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="19" font-weight="600" fill="#fff">${m.centre}</text>
      ${m.around.map((v,i)=>`<rect x="${pos[i][0]}" y="${pos[i][1]}" width="100" height="32" rx="16" fill="#E7EFF9" stroke="#1D5FA8" stroke-width="1.5"/>

  count_grid(m){

    rows.forEach((r,i)=>{
      const oy=20+i*rowH;

      for(let c=0;c<r.count;c++) out+=`<rect x="${c*(s+gap)}" y="${oy+9}" width="${s}" height="${s}" fill="#14243A" rx="2"/>`;

  },
  matchstick(m){
    const yT=20,yB=66,roof=6; let out=`<svg viewBox="0 0 560 86" role="img" aria-label="Matchstick pattern in ${m.stages} stages">`;
    for(let stage=1;stage<=m.stages;stage++){
      const ox=15+(stage-1)*138, edges=new Map();
      const add=(x1,y1,x2,y2)=>{const k=[x1,y1,x2,y2].map(Math.round).join(','),r=[x2,y2,x1,y1].map(Math.round).join(',');
        if(!edges.has(k)&&!edges.has(r)) edges.set(k,[x1,y1,x2,y2]);};
      if(m.shape==='triangle'){ const w=13;
        for(let k=0;k<stage;k++){ const j=Math.floor(k/2);
          const B=i=>[ox+i*2*w,yB], T=i=>[ox+w+i*2*w,yT];
          if(k%2===0){const[bx,by]=B(j),[tx,ty]=T(j),[b2x,b2y]=B(j+1);
            add(bx,by,b2x,b2y); add(bx,by,tx,ty); add(tx,ty,b2x,b2y);}
          else {const[tx,ty]=T(j),[b2x,b2y]=B(j+1),[t2x,t2y]=T(j+1);
            add(tx,ty,b2x,b2y); add(b2x,b2y,t2x,t2y); add(tx,ty,t2x,t2y);} } }
      else if(m.shape==='square'){ const w=28;
        for(let k=0;k<stage;k++){const x=ox+k*w;
          add(x,yT,x+w,yT); add(x,yB,x+w,yB); add(x,yT,x,yB); add(x+w,yT,x+w,yB);} }

      <p class="q-prompt">${esc(q.prompt)}${q.sub?`<span class="sub">${esc(q.sub)}</span>`:''}</p>
      ${res?tick(res==='correct'):''}</div>`;
  if(q.needsHuman) h+=`<div class="panel hint"><h4>Needs a check</h4><p>${esc(q.reviewReason||'This question could not be read confidently from the photograph.')}</p></div>`;
  if(q.media) h+=renderMedia(q.media);
  if(q.layout==='grid') h+=renderGrid(q);
  else if(q.layout==='table') h+=renderTable(q);
  else h+=`<div class="fields ${q.layout==='row'?'row':''}">${q.fields.map(f=>renderField(q,f)).join('')}</div>`;

  h+=`<div class="q-actions">
      <button class="btn btn-primary" data-act="check">${ICON.check} Check answer</button>
      <button class="btn btn-hint" data-act="hint">${ICON.bulb} ${hint?'Hide hint':'Give me a hint'}</button>
      ${res?`<button class="btn btn-ghost" data-act="retry">${ICON.undo} Try again</button>`:''}
      ${STATE.lang!=='en'?`<button class="btn btn-ghost" data-act="translate">${ICON.globe} Explain in ${esc(LANGS[STATE.lang])}</button>`:''}
    </div>`;
  if(hint) h+=`<div class="panel hint"><h4>Hint</h4><p>${nl2(q.hint)}</p></div>`;
  if(res==='correct') h+=`<div class="panel solved"><h4>Correct</h4><p>${nl2(q.explanation)}</p></div>`;
  if(res==='wrong') h+=`<div class="panel explain"><h4>How it works</h4><p>${nl2(q.explanation)}</p></div>`;
  if(tr) h+=`<div class="panel explain" lang="${STATE.lang}"><h4>For the parent — ${esc(LANGS[STATE.lang])}</h4><p>${nl2(tr)}</p></div>`;
  return h+`</section>`;
}
const tick=ok=>`<span class="tickbox ${ok?'ok':''}" aria-hidden="true"><svg viewBox="0 0 40 40">
  ${ok?'<path d="M7 21 L16 30 L33 9" style="--len:60"/>':'<path d="M10 10 L30 30 M30 10 L10 30" style="--len:58"/>'}</svg></span>`;

function renderField(q,f){
  const val=getAns(q,f.key), res=STATE.results[q.id];
  const ok=res?checkAnswer(f.check,val===undefined?'':val):null;
  const mark=ok===false?`<span class="mark no">answer: ${esc(answerText(f))}</span>`:'';
  const state=ok===true?'correct':ok===false?'incorrect':'';
  const id=`f-${q.id}-${f.key}`;
  if(f.input==='choice'||f.input==='multi'){
    const sel=f.input==='choice'?(val||''):(Array.isArray(val)?val:[]);
    return `<div class="field ${state}"><label id="${id}-l">${esc(f.label)}</label>
      <div class="choices" role="group" aria-labelledby="${id}-l">${f.options.map(o=>{
        const on=f.input==='choice'?sel===o:sel.includes(o); let ex='';
        if(res){ const isAns=f.check.kind==='choice'?f.check.value===o:(f.check.values||[]).includes(o);
          if(isAns) ex=' correct'; else if(on) ex=' incorrect'; }
        return `<button type="button" class="choice${ex}" aria-pressed="${on}" data-fk="${f.key}" data-opt="${esc(o)}" data-multi="${f.input==='multi'}">${esc(o)}</button>`;
      }).join('')}</div>${mark}</div>`;
  }
  return `<div class="field ${f.width?'w-'+f.width:''} ${state}">
    <label for="${id}">${esc(f.label)}</label>
    <input type="text" id="${id}" data-fk="${f.key}" autocomplete="off" spellcheck="false"
      value="${val===undefined?'':esc(val)}" placeholder="${esc(f.placeholder||'')}">${mark}</div>`;
}

function renderTable(q){
  const cols=q.table.head.length, ins=q.fields.filter(f=>f.inTable);
  let fi=0,rows='';
  q.table.rows.forEach(r=>{
    let cells=r.map(c=>`<td>${esc(c)}</td>`).join('');
    for(let c=r.length;c<cols;c++){ const f=ins[fi++];
      cells+=`<td>${f?tableInput(q,f):''}</td>`; }
    rows+=`<tr>${cells}</tr>`;
  });
  return `<div class="tbl-scroll"><table class="tbl"><thead><tr>${q.table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function tableInput(q,f){
  const val=getAns(q,f.key), res=STATE.results[q.id];
  const ok=res?checkAnswer(f.check,val===undefined?'':val):null;
  return `<div class="field ${ok===true?'correct':ok===false?'incorrect':''}" style="gap:2px">
    <input type="text" data-fk="${f.key}" autocomplete="off" spellcheck="false" aria-label="${esc(f.label)}"
      value="${val===undefined?'':esc(val)}" placeholder="${esc(f.placeholder||'')}">
    ${ok===false?`<span class="mark no">${esc(answerText(f))}</span>`:''}</div>`;
}
function renderGrid(q){
  const f=q.fields.find(x=>x.input==='grid');
  const raw=getAns(q,f.key), sel=Array.isArray(raw)?raw:[], res=STATE.results[q.id];
  const target=f.check.values;
  let cells='';
  for(let n=1;n<=100;n++){
    const on=sel.includes(n); let ex='';
    if(res){ if(on&&target.includes(n)) ex=' hit'; else if(on) ex=' miss'; else if(target.includes(n)) ex=' missed-prime'; }
    cells+=`<button type="button" class="cellbtn${ex}" aria-pressed="${on}" data-cell="${n}" data-fk="${f.key}">${n}</button>`;
  }
  let lg=`<div class="grid-legend"><span><span class="swatch" style="background:var(--pen);border-color:var(--pen)"></span>your pick</span>`;
  if(res) lg+=`<span><span class="swatch" style="background:var(--green-wash);border-color:var(--green)"></span>found</span>
    <span><span class="swatch" style="background:var(--red-wash);border-color:var(--red)"></span>wrong</span>
    <span><span class="swatch" style="border-color:var(--amber);border-style:dashed"></span>missed</span>`;
  lg+=`<span class="count">selected: ${sel.length} of ${target.length}</span></div>`;
  return `<div class="grid100" role="group" aria-label="Numbers 1 to 100">${cells}</div>${lg}`;
}

/* ============================================================
   DIAGNOSTIC REPORT — grouped by skill, not by worksheet
   ============================================================ */
function renderReport(){
  const bySkill={};
  PACK.sheets.forEach(s=>{
    const k=s.skill||'unclassified';
    bySkill[k]=bySkill[k]||{skill:k,title:s.title,attempted:0,correct:0,total:0,weak:[]};
    s.questions.forEach(q=>{
      bySkill[k].total++;
      const r=STATE.results[q.id];
      if(r){ bySkill[k].attempted++;
        if(r==='correct') bySkill[k].correct++;
        else bySkill[k].weak.push({sheet:s,q}); }
    });
  });
  const rows=Object.values(bySkill);
  const attempted=rows.reduce((a,r)=>a+r.attempted,0);
  if(!attempted) return `<div class="sheet-head"><p class="eyebrow">Progress</p><h2>Nothing to report yet</h2>
    <p class="obj">Answer a few questions and this page will show which skills are solid and which ones need another go — grouped by skill, not by worksheet, because that is what a re-teach plan needs.</p></div>`;

  return `<div class="sheet-head"><p class="eyebrow">Progress</p><h2>What to practise next</h2>
    <p class="obj">${attempted} question${attempted>1?'s':''} attempted. Skills below 70% are worth revisiting before the next worksheet.</p></div>
    ${rows.filter(r=>r.attempted).sort((a,b)=>(a.correct/a.attempted)-(b.correct/b.attempted)).map(r=>{
      const pc=Math.round(r.correct/r.attempted*100);
      const band=pc>=85?'var(--green)':pc>=70?'var(--pen)':'var(--red)';
      return `<div class="q">
        <div class="q-head"><span class="q-no" style="background:${band};color:#fff">${pc}%</span>
        <p class="q-prompt">${esc(r.title)}<span class="sub">skill: ${esc(r.skill)} · ${r.correct} of ${r.attempted} attempted correct · ${r.total-r.attempted} not yet tried</span></p></div>
        ${r.weak.length?`<div class="panel explain"><h4>Go back to</h4>
          ${r.weak.map(w=>`<p><strong>WS${w.sheet.no} Q${esc(w.q.label)}</strong> — ${esc(w.q.prompt.slice(0,90))}${w.q.prompt.length>90?'…':''}</p>`).join('')}
        </div>`:`<div class="panel solved"><h4>Solid</h4><p>Every attempted question in this skill was correct.</p></div>`}
      </div>`;}).join('')}`;
}

/* ============================================================
   MARKING
   ============================================================ */
function grade(q){
  const a=STATE.answers[q.id]||{};
  if(!q.fields.some(f=>!isBlank(a[f.key]))) return null;
  const ok=q.fields.every(f=>checkAnswer(f.check,a[f.key]===undefined?'':a[f.key]));
  STATE.results[q.id]=ok?'correct':'wrong';
  return ok;
}
function checkQ(sheet,q){
  const r=grade(q);
  if(r===null){ toast('Write an answer first, then check'); return; }
  saveState(); rerender(sheet,q); toast(r?'Correct':'Not quite — read the explanation');
}
function rerender(sheet,q){
  const old=document.getElementById('qq-'+q.id); if(!old){ renderMain(); return; }
  const t=document.createElement('div'); t.innerHTML=renderQuestion(sheet,q);
  old.replaceWith(t.firstElementChild); updateMeter(); updateFoot(sheet);
}
function updateFoot(sheet){
  const el=document.querySelector('.sheet-foot .score'); if(!el) return;
  let c=0; sheet.questions.forEach(q=>{if(STATE.results[q.id]==='correct')c++;});
  el.innerHTML=`Worksheet ${sheet.no}: <strong>${c}</strong> of ${sheet.questions.length} questions correct`;
}
function updateMeter(){
  const all=allQuestions();
  const c=all.filter(({q})=>STATE.results[q.id]==='correct').length;
  document.getElementById('meterLabel').textContent=`${c} / ${all.length}`;
  document.getElementById('meterFill').style.width=(all.length?c/all.length*100:0)+'%';
}

/* ============================================================
   PARENT LANGUAGE LAYER
   ============================================================ */
const LANGS={en:'English',ta:'Tamil',hi:'Hindi',te:'Telugu',kn:'Kannada',ml:'Malayalam',mr:'Marathi',bn:'Bengali'};
async function translateQuestion(q){
  const key=q.id+':'+STATE.lang;
  if(STATE.i18n[key]) return;
  toast('Translating…');
  const prompt=`You are helping an Indian parent who does not speak English fluently support their child with school maths.
Rewrite the following in ${LANGS[STATE.lang]}, in simple everyday language a parent can read aloud.
Keep all numbers and mathematical symbols in Western digits. Do not add anything new. Return only the translation.

QUESTION: ${q.prompt}${q.sub?' '+q.sub:''}
HOW TO EXPLAIN IT: ${q.explanation}`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    if(!res.ok) throw new Error('http '+res.status);
    const data=await res.json();
    const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    if(!text) throw new Error('empty');
    STATE.i18n[key]=text; saveState();
  }catch(e){
    STATE.i18n[key]='Translation is not available in this preview. In the app this call runs on your server, so it works offline of the browser and the result is cached against the question so it is only paid for once.';
  }
}

/* ============================================================
   EVENTS
   ============================================================ */
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  view=b.dataset.view; buildTabs(); renderMain(); window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('lang').addEventListener('change',e=>{
  STATE.lang=e.target.value; saveState(); renderMain();
  if(STATE.lang!=='en') toast('Open any question and press "Explain in '+LANGS[STATE.lang]+'"');
});

const MAIN=document.getElementById('main');
const qOf=el=>{const s=el.closest('.q'); if(!s||!s.dataset.qid) return null;
  const id=s.dataset.qid; const sheet=PACK.sheets.find(x=>x.questions.some(q=>q.id===id));
  return sheet?{sheet,q:sheet.questions.find(q=>q.id===id)}:null;};

MAIN.addEventListener('input',e=>{
  const i=e.target.closest('input[type="text"]'); if(!i) return;
  const c=qOf(i); if(c) setAns(c.q,i.dataset.fk,i.value);
});
MAIN.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const i=e.target.closest('input[type="text"]'); if(!i) return;
  e.preventDefault(); const c=qOf(i); if(c) checkQ(c.sheet,c.q);
});
MAIN.addEventListener('click',async e=>{
  const cell=e.target.closest('.cellbtn');
  if(cell){ const c=qOf(cell); if(!c) return;
    const n=Number(cell.dataset.cell), prev=getAns(c.q,cell.dataset.fk);
    const cur=Array.isArray(prev)?[...prev]:[], ix=cur.indexOf(n);
    if(ix>-1) cur.splice(ix,1); else cur.push(n);
    setAns(c.q,cell.dataset.fk,cur);
    cell.setAttribute('aria-pressed',ix===-1); cell.classList.remove('hit','miss','missed-prime');
    const ct=cell.closest('.q').querySelector('.grid-legend .count');
    const f=c.q.fields.find(x=>x.input==='grid');
    if(ct) ct.textContent=`selected: ${cur.length} of ${f.check.values.length}`;
    return; }

  const ch=e.target.closest('.choice');
  if(ch){ const c=qOf(ch); if(!c) return;
    if(ch.dataset.multi==='true'){
      const prev=getAns(c.q,ch.dataset.fk), cur=Array.isArray(prev)?[...prev]:[];
      const ix=cur.indexOf(ch.dataset.opt);
      if(ix>-1) cur.splice(ix,1); else cur.push(ch.dataset.opt);
      setAns(c.q,ch.dataset.fk,cur); ch.setAttribute('aria-pressed',ix===-1);
    } else {
      setAns(c.q,ch.dataset.fk,ch.dataset.opt);
      ch.parentElement.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',b===ch));
    }
    return; }

  const btn=e.target.closest('[data-act]'); if(!btn) return;
  const act=btn.dataset.act, ctx=qOf(btn);
  if(act==='check'&&ctx) checkQ(ctx.sheet,ctx.q);
  else if(act==='hint'&&ctx){ STATE.hints[ctx.q.id]=!STATE.hints[ctx.q.id]; saveState(); rerender(ctx.sheet,ctx.q); }
  else if(act==='retry'&&ctx){ delete STATE.results[ctx.q.id]; saveState(); rerender(ctx.sheet,ctx.q); }
  else if(act==='translate'&&ctx){ await translateQuestion(ctx.q); rerender(ctx.sheet,ctx.q); }
  else if(act==='checkall'){ const sheet=sheetById(view); let n=0;
    sheet.questions.forEach(q=>{ if(grade(q)!==null) n++; });
    saveState(); renderMain(); toast(n?`Marked ${n} question${n>1?'s':''}`:'Type some answers first'); }
  else if(act==='clearall'){ const sheet=sheetById(view);
    sheet.questions.forEach(q=>{ delete STATE.answers[q.id]; delete STATE.results[q.id]; delete STATE.hints[q.id]; });
    saveState(); renderMain(); toast('Worksheet cleared'); }
});

/* ---- boot ---- */
(async function(){
  await loadState();
  const sel=document.getElementById('lang');
  sel.innerHTML=Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${k===STATE.lang?'selected':''}>${v}</option>`).join('');
  document.getElementById('packName').textContent=PACK.source.book;
  document.getElementById('packSub').textContent=
    `${PACK.curriculum.subject} · ${PACK.curriculum.stage} · converted from ${PACK.source.photoCount} photos`;
  buildTabs(); renderMain();
})();
</script>
